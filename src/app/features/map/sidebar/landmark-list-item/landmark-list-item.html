<button
  type="button"
  class="flex w-full items-start gap-3 rounded-lg p-2 text-left transition-colors hover:bg-emerald-50"
  [class.bg-emerald-50]="selected()"
  [class.ring-1]="selected()"
  [class.ring-emerald-300]="selected()"
  (click)="select.emit(landmark().id)"
>
  <span class="mt-0.5 text-lg">{{ icon() }}</span>
  <span class="min-w-0">
    <span class="block truncate text-sm font-medium text-slate-800">{{ landmark().name }}</span>
    <span class="block truncate text-xs text-slate-500">{{ landmark().address }}</span>
  </span>
</button>
