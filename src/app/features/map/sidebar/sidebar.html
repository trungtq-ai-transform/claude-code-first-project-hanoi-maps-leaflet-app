<div class="flex h-full flex-col gap-3 overflow-hidden bg-white p-4">
  <div class="flex items-start justify-between">
    <div>
      <h1 class="text-lg font-bold text-slate-900">Bản đồ Hà Nội</h1>
      <p class="text-xs text-slate-500">Khám phá địa danh tiêu biểu của thủ đô</p>
    </div>
    <button
      type="button"
      class="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 md:hidden"
      (click)="mapState.toggleSidebar()"
      aria-label="Đóng"
    >
      ✕
    </button>
  </div>

  <app-search-bar />
  <app-category-filter />

  <h3 class="border-t border-slate-100 pt-2 text-xs font-semibold uppercase tracking-wide text-slate-500">
    Địa danh ({{ mapState.filteredLandmarks().length }})
  </h3>

  <div class="-mx-1 flex-1 overflow-y-auto px-1">
    <app-landmark-list />
  </div>
</div>
