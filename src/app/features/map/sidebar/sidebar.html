<div class="flex h-full flex-col gap-3 overflow-hidden bg-white p-4 dark:bg-slate-800">
  <div class="flex items-start justify-between">
    <div>
      <h1 class="text-lg font-bold text-slate-900 dark:text-slate-100">Bản đồ Hà Nội</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">Khám phá địa danh tiêu biểu của thủ đô</p>
    </div>
    <div class="flex items-center gap-1">
      <button
        type="button"
        class="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'"
        [attr.aria-pressed]="theme.isDark()"
      >
        {{ theme.isDark() ? '☀️' : '🌙' }}
      </button>
      <button
        type="button"
        class="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 md:hidden"
        (click)="mapState.toggleSidebar()"
        aria-label="Đóng"
      >
        ✕
      </button>
    </div>
  </div>

  <app-search-bar />
  <app-category-filter />

  <h3 class="border-t border-slate-100 pt-2 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:border-slate-700 dark:text-slate-400">
    Địa danh ({{ mapState.filteredLandmarks().length }})
  </h3>

  <div class="-mx-1 flex-1 overflow-y-auto px-1">
    <app-landmark-list />
  </div>
</div>
